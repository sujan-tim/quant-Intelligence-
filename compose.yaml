services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qip
      POSTGRES_USER: qip
      POSTGRES_PASSWORD: qip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qip -d qip"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    environment:
      QIP_DATABASE_URL: postgresql+psycopg://qip:qip@db:5432/qip
      QIP_DEMO_PROVIDER_ENABLED: "true"
      QIP_ALPHA_VANTAGE_API_KEY: ${QIP_ALPHA_VANTAGE_API_KEY:-}
      QIP_MARKET_DATA_ENTITLEMENT: ${QIP_MARKET_DATA_ENTITLEMENT:-historical}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn quant_intelligence.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:

